<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixBooth - Photo Booth Online</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff7eb3, #ff758c);
      color: white;
      text-align: center;
      padding: 50px;
    }
    h1 {
      font-size: 3em;
    }
    p {
      font-size: 1.2em;
    }
    button {
      background-color: white;
      color: #ff758c;
      border: none;
      padding: 15px 30px;
      border-radius: 30px;
      font-size: 1em;
      cursor: pointer;
      margin-top: 20px;
      transition: 0.3s;
    }
    button:hover {
      background-color: #ffe4ec;
    }
  </style>
</head>
<body>
  <h1>📸 PixBooth</h1>
  <p>Ambil foto langsung dari kamera kamu dan beri efek lucu!</p>
  <button onclick="alert('Fitur ini akan aktif nanti 😄')">Mulai Photo Booth</button>
</body>
</html>
